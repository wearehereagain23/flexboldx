<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Account Login | Flexboldx</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Log in to your Flexboldx trading and investment account.">

    <!-- Favicon -->
    <link rel="shortcut icon" href="images/RNxS0pweRr6L.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Shared Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="auth-page">
        <!-- Background Visual Accents matching Registration -->
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>

        <div class="auth-container">
            <!-- Header Logo Section -->
            <div class="auth-header">
                <a href="../index.html" class="brand-logo">
                    <img src="asset/logo.png" alt="Flexboldx Logo" onerror="this.src='asset/logo.png'">
                </a>
                <p class="subtitle">Access your trading & investment portal</p>
            </div>

            <!-- Form Card -->
            <div class="auth-card">
                <div class="card-header">
                    <h2>Welcome Back</h2>
                    <p>Enter your credentials to access your dashboard</p>
                </div>

                <form id="loginForm" class="auth-form" novalidate>

                    <!-- Identifier (Username or Email) -->
                    <div class="form-group">
                        <label for="identifier">Username or Email <span class="required">*</span></label>
                        <div class="input-icon-wrapper">
                            <i class="ri-user-3-line input-icon"></i>
                            <input type="text" id="identifier" name="identifier" class="form-control"
                                placeholder="e.g. johndoe99 or name@example.com" required autocomplete="username">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <div class="label-with-link">
                            <label for="password">Password <span class="required">*</span></label>
                            <a href="#" id="forgotPasswordBtn" class="forgot-link">Forgot Password?</a>
                        </div>
                        <div class="input-icon-wrapper">
                            <i class="ri-lock-2-line input-icon"></i>
                            <input type="password" id="password" name="password" class="form-control"
                                placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="password-toggle-btn" data-target="password" tabindex="-1">
                                <i class="ri-eye-off-line"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="loginBtn" class="btn-primary">
                        <span class="btn-text">Sign In</span>
                        <div class="btn-loader" id="btnSpinner" style="display: none;"></div>
                    </button>
                </form>
            </div>

            <!-- Card Footer Link -->
            <div class="auth-footer">
                <p>Don't have an account? <a href="../register/index.html">Create Account</a></p>
                <span class="copyright">&copy;
                    <script>document.write(new Date().getFullYear())</script> Flexboldx. All rights reserved.
                </span>
            </div>
        </div>
    </div>

    <!-- Script Controller -->



    <!-- LiveChat Scoped UI Panel -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="../css/live-chat.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- LiveChat Scoped UI Panel -->
    <div class="lc-widget-launcher-wrapper">
        <!-- Popup Toaster Notification -->
        <div id="chat-toaster" class="lc-widget-toaster-popup">
            <span>Need help? Chat with us!</span>
            <button type="button" id="close-chat-toaster" class="lc-widget-toaster-close-btn"
                title="Dismiss">&times;</button>
        </div>

        <!-- Floating Trigger Bubble -->
        <button type="button" id="live-chat-trigger-bubble" class="lc-widget-bubble-launcher" title="Chat with support">
            <i class="fa fa-comments"></i>
        </button>
    </div>

    <!-- Slide-in Chat UI Panel -->
    <div class="lc-widget-drawer-overlay" id="chatDrawerOverlay"></div>
    <div class="lc-widget-drawer" id="chatDrawer">
        <div class="lc-widget-drawer-header">
            <div class="lc-widget-title">
                <i data-lucide="message-square"></i>
                <span>Support Channel</span>
            </div>
            <div class="lc-widget-header-actions" style="display: flex; align-items: center; gap: 8px;">
                <!-- Logout Button (Only visible when user is logged in) -->
                <button type="button" id="chatLogoutBtn" class="lc-widget-action-btn" title="Log Out"
                    style="display: none; background: transparent; border: none; color: #ef4444; cursor: pointer;">
                    <i data-lucide="log-out"></i>
                </button>
                <button type="button" id="closeChatDrawerBtn" class="lc-widget-action-btn" title="Close Chat">
                    <i data-lucide="x"></i>
                </button>
            </div>
        </div>

        <div class="lc-widget-feed-container" id="chat-message-feed">
            <!-- Dynamically Hydrated by live-chat.js -->
        </div>

        <div class="lc-widget-drawer-footer">
            <input type="file" id="chat-image-attachment-input" style="display: none;" accept="image/*">
            <button type="button" id="chat-attachment-trigger-btn" class="lc-widget-tool-btn"
                title="Attach Document/Image">
                <i data-lucide="paperclip"></i>
            </button>
            <input type="text" id="chat-terminal-text-field" class="lc-widget-input-field"
                placeholder="Type a message...">
            <button type="button" id="chat-send-message-btn" class="lc-widget-send-btn">
                <i data-lucide="send"></i>
            </button>
        </div>
    </div>


    <script src="../js/live-chat.js" defer></script>
    <script type="module" src="./js/index.js"></script>
</body>

</html>
