<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flexboldx Core - System Settings & Asset Management</title><link rel="stylesheet" href="css/list.css"><link rel="stylesheet" href="css/settings.css"><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script type="module" src="js/settings.js" defer></script><link rel="icon" type="image/png" href="../images/favicon.png"></head><body><div class="settings-page-wrapper"><header class="settings-header"><div class="header-left"><a href="list.html" class="back-link-btn" title="Back to Console"><i data-lucide="arrow-left"></i></a><div><h2>System Administrative Control</h2><p>Manage system pricing parameters, descriptions, and dynamic wallet assets</p></div></div></header><main class="settings-content-grid"><!-- ADMIN PARAMETERS & PRICING FORM --><section class="settings-card"><div class="card-header-bar"><i data-lucide="sliders"></i><h3>General & Tier Pricing Configuration</h3></div><form id="adminSettingsForm" class="settings-form"><div class="form-section-title">General Details</div><div class="form-row dual-fields"><div class="form-group"><label>Physical Address</label> <input type="text" id="address" name="address" placeholder="Company Physical Address"></div><div class="form-group"><label>Bonus Numeric Value</label> <input type="number" step="any" id="bonus" name="bonus" placeholder="10"></div></div><div class="form-section-title">Plan Pricing Thresholds</div><!-- Starter --><div class="tier-box"><span class="tier-label">Starter Plan</span><div class="form-row triple-fields"><div class="form-group"><label>Min Price</label> <input type="number" step="any" id="starter_min" name="starter_min"></div><div class="form-group"><label>Max Price</label> <input type="number" step="any" id="starter_max" name="starter_max"></div><div class="form-group"><label>Description</label> <input type="text" id="starter_des" name="starter_des"></div></div></div><!-- Mini --><div class="tier-box"><span class="tier-label">Mini Plan</span><div class="form-row triple-fields"><div class="form-group"><label>Min Price</label> <input type="number" step="any" id="mini_min" name="mini_min"></div><div class="form-group"><label>Max Price</label> <input type="number" step="any" id="mini_max" name="mini_max"></div><div class="form-group"><label>Description</label> <input type="text" id="mini_des" name="mini_des"></div></div></div><!-- Silver --><div class="tier-box"><span class="tier-label">Silver Plan</span><div class="form-row triple-fields"><div class="form-group"><label>Min Price</label> <input type="number" step="any" id="sliver_min" name="sliver_min"></div><div class="form-group"><label>Max Price</label> <input type="number" step="any" id="sliver_max" name="sliver_max"></div><div class="form-group"><label>Description</label> <input type="text" id="sliver_des" name="sliver_des"></div></div></div><!-- Gold --><div class="tier-box"><span class="tier-label">Gold Plan</span><div class="form-row triple-fields"><div class="form-group"><label>Min Price</label> <input type="number" step="any" id="gold_min" name="gold_min"></div><div class="form-group"><label>Max Price</label> <input type="number" step="any" id="gold_max" name="gold_max"></div><div class="form-group"><label>Description</label> <input type="text" id="gold_des" name="gold_des"></div></div></div><!-- Platinum --><div class="tier-box"><span class="tier-label">Platinum Plan</span><div class="form-row triple-fields"><div class="form-group"><label>Min Price</label> <input type="number" step="any" id="platinum_min" name="platinum_min"></div><div class="form-group"><label>Max Price</label> <input type="number" step="any" id="platinum_max" name="platinum_max"></div><div class="form-group"><label>Description</label> <input type="text" id="platinum_des" name="platinum_des"></div></div></div><div class="form-action-footer"><button type="submit" class="save-settings-btn"><i data-lucide="save"></i> Save Administrative Settings</button></div></form></section><!-- CRYPTO ASSETS MANAGED TODO-LIST --><section class="settings-card"><div class="card-header-bar"><i data-lucide="wallet"></i><h3>Crypto Assets & Wallet Addresses</h3></div><form id="addAssetForm" class="add-asset-input-row"><input type="text" id="new_asset_name" placeholder="Asset Name (e.g. Bitcoin / USDT TRC20)" required> <input type="text" id="new_asset_address" placeholder="Wallet Address" required> <button type="submit" class="add-asset-btn"><i data-lucide="plus"></i> Add Asset</button></form><div class="assets-list-wrapper"><ul id="assetsTodoList" class="todo-list"><!-- Loaded via settings.js --></ul></div></section></main></div></body></html>
